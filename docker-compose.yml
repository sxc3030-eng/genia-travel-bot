services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genia
      POSTGRES_PASSWORD: genia
      POSTGRES_DB: genia_travel_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genia"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
